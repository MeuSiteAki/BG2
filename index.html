<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Painel de Controle — BURGUER GRILL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="/meu-favicon.ico" />

  <style>
   :root {
  --bg: #121212;
  --card: #1e1e1e;
  --border: #333;
  --accent: #ffbf00;
  --danger: #d32f2f;
  --success: #25d366;
  --text: #eee;
  --muted: #aaa;
}

* {
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  margin: 0;
}

/* --- LOGIN SCREEN --- */
#login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
}

#login-screen input:not([type="password"]) {
  margin: 8px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: #fff;
  width: 280px;
}

/* Container específico para o input de senha com olhinho */
.password-container {
  position: relative;
  width: 280px;
  margin: 8px auto;
}

.password-container input {
  width: 100% !important;
  padding: 10px 40px 10px 10px !important; /* Espaço na direita para o ícone */
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: #fff;
  margin: 0 !important;
}

#toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: var(--muted);
  z-index: 10;
  font-size: 1.1rem;
}

#toggle-password:hover {
  color: var(--accent);
}

#login-screen button {
  margin-top: 12px;
}

/* --- INTERFACE GERAL --- */
header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

header h1 {
  margin: 0;
  color: var(--accent);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.actions .btn {
  min-width: 140px;
}

.tabs, .subtabs {
  display: flex;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.subtabs {
  padding: 0;
  border-bottom: none;
  margin-bottom: 12px;
}

.tab-btn, .subtab-btn {
  background: #222;
  color: var(--accent);
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.subtab-btn {
  padding: 8px 12px;
  border-radius: 6px;
}

.tab-btn.active, .subtab-btn.active {
  background: var(--accent);
  color: #000;
}

.tab, .subtab {
  display: none;
}

.tab.active, .subtab.active {
  display: block;
}

.tab {
  padding: 16px 20px;
}

/* --- GRID E CARDS --- */
.grid, .mesas-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.card, .mesa-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.mesa-card {
  transition: border-color .2s, transform .2s, box-shadow .2s, opacity .2s;
}

.mesa-card.livre { border-color: var(--success); }
.mesa-card.ocupada { border-color: var(--danger); }

.mesa-items {
  border-top: 1px dashed var(--border);
  margin-top: 8px;
  padding-top: 8px;
  max-height: 220px;
  overflow: auto;
}

.mesa-total, .hist-total {
  margin-top: 8px;
  font-weight: bold;
  color: var(--accent);
}

/* --- ESTADOS DE DESTAQUE --- */
.mesa-card.highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  transform: scale(1.02);
}

.mesas-grid.highlight-mode .mesa-card:not(.highlight) {
  opacity: 0.25;
  pointer-events: none;
}

/* --- BOTÃO FLUTUANTE --- */
#floating-toggle {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 1000;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50px;
  padding: 12px 16px;
  font-weight: bold;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  cursor: pointer;
  display: none;
}

/* --- BOTÕES --- */
.btn {
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: bold;
}

.btn-accent { background: var(--accent); color: #000; }
.btn-outline { background: #222; color: var(--accent); border: 1px solid var(--accent); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }

/* --- MODAL --- */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 999;
  overflow: auto;
}

.modal-content {
  max-width: 900px;
  margin: 40px auto;
  background: #1a1a1a;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.menu-section {
  margin-bottom: 14px;
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
}

.menu-section-header {
  background: #222;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.menu-section-header h3 { margin: 0; color: var(--accent); font-size: 1rem; }
.menu-section-header .toggle { font-size: 24px; background: transparent; color: #fff; border: none; cursor: pointer; }

.menu-items { display: none; padding: 10px 12px; background: #1f1f1f; }
.menu-items.show { display: block; }

.menu-item {
  background: #222;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.carrinho-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

/* --- INPUTS GERAIS --- */
select {
  background: #222;
  color: #fff;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
}

.swal2-radio label { color: #000 !important; }

/* --- MEDIA QUERIES --- */
@media (max-width:1024px) {
  .grid, .mesas-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width:768px) {
  .grid, .mesas-grid { grid-template-columns: 1fr; }
  .mesas-grid.highlight-mode { grid-template-columns: 1fr; }
  .mesa-card.highlight { transform: scale(1.03); }
  .btn { padding: 10px 12px; }
}
/* --- NOVA SIDEBAR --- */
#sidebar {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: #1a1a1a;
  border-right: 1px solid #333;
  z-index: 1000;
  transition: 0.3s;
  padding: 20px;
  display: flex;
  flex-direction: column;
}
#sidebar.open { left: 0; }

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  z-index: 1000;
}
.sidebar-overlay.active { display: block; }

.sidebar-nav { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

.sidebar-btn {
  background: #222;
  color: #fff;
  border: 1px solid #333;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}
.sidebar-btn:hover { background: var(--accent); color: #000; }
.swal2-container {
  z-index: 10000 !important;
}
/* Ajuste do Header */
header {
  display: flex;
  align-items: center;
  justify-content: flex-start !important;
  gap: 15px;
  padding: 10px 20px;
}
/* --- DELIVERY CARDS GLASS --- */
.dcard {
  position: relative;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12) !important;
  border-radius: 16px !important;
  overflow: hidden;
}
.dcard::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.dcard-delivery::before { background: linear-gradient(90deg, #3b82f6, #6366f1); }
.dcard-retirada::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }

.dcard-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.dcard-nome { font-size: 17px; font-weight: 500; color: #fff; margin: 0 0 2px; }
.dcard-num { font-size: 12px; color: #888; }

.dcard-badge { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.dcard-badge-delivery { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
.dcard-badge-retirada { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }

.dcard-info-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #aaa; margin-bottom: 6px; }
.dcard-icon { font-size: 12px; width: 16px; flex-shrink: 0; margin-top: 2px; }

.dcard-pag-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 3px 10px; border-radius: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #aaa; margin-bottom: 10px; }

.dcard-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }

.dcard-itens { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.dcard-item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.dcard-item-nome { color: #eee; flex: 1; }
.dcard-item-obs { font-size: 11px; color: #888; }
.dcard-item-preco { font-size: 13px; font-weight: 500; color: #6ee7b7; flex-shrink: 0; margin-left: 8px; }

.dcard-footer { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px; }
.dcard-total-label { font-size: 11px; color: #888; margin-bottom: 2px; }
.dcard-total-valor { font-size: 22px; font-weight: 500; color: #34d399; line-height: 1; }
.dcard-hora { font-size: 11px; color: #888; text-align: right; }
.dcard-badge-mesa { background: rgba(37,211,102,0.15); color: #6ee7b7; border: 1px solid rgba(37,211,102,0.3); }
.dcard-mesa::before { background: linear-gradient(90deg, #25d366, #059669); }

.menu-section-header h3 {
    font-size: 1.4rem !important; 
    font-weight: 800 !important;
    color: #ffbf00 !important;   
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* 2. Botão de + e - das categorias */
.menu-section-header .toggle {
    font-size: 1.6rem !important;
    font-weight: bold;
    color: #ffbf00 !important;
    width: 40px;
    height: 40px;
}

/* 3. Título "Itens Selecionados" (Carrinho no modal) */
#menu-modal h3:contains("Mesa"), 
#menu-modal h4:contains("Itens"),
#menu-modal b, 
.modal-content h3 {
    font-size: 1.3rem !important;
    color: #25d366 !important; 
    font-weight: 800 !important;
}

/* 4. ITENS DO CARDÁPIO (O ajuste que você pediu) */
.menu-item h4 {
    font-size: 1.25rem !important; /* Aumentado para leitura rápida */
    font-weight: 800 !important;  /* Fonte bem "viva" e grossa */
    color: #ffffff !important;    /* Branco puro para brilhar no escuro */
    margin-bottom: 2px;
}

/* 5. Preço dos itens no Menu */
.menu-item small {
    font-size: 1.05rem !important; /* Preço um pouco maior também */
    color: #00ff00 !important;     /* Verde limão vivo para o preço saltar aos olhos */
    font-weight: 700;
}

/* 6. Itens já adicionados no Carrinho (Aumentados também) */
#carrinho-list div {
    font-size: 1.2rem !important;  /* Mais visível no checkout */
    font-weight: 700 !important;
    color: #fff !important;
    padding: 10px 0;
    border-bottom: 1px solid #444;
}

/* 7. Botão X de remover do carrinho */
#carrinho-list .btn-danger {
    padding: 6px 14px !important;
    font-size: 1.1rem !important;
    margin-left: 10px;
}

/* 8. Botão Adicionar (Add) e Obs no Menu */
.menu-item .btn-outline {
    font-size: 1rem !important;
    font-weight: bold !important;
    padding: 8px 12px !important;
}
  </style>
</head>

          const obs = partes[2]?.trim();
          return `&nbsp;&nbsp;• ${nome}${preco ? ' — <b>R$ ' + preco + '</b>' : ''}${obs ? ' <em style="color:#aaa">(${obs})</em>' : ''}`;

  mesasTotalEl.textContent = `Total Mesas: R$ ${totalMesas.toFixed(2).replace('.', ',')}`;

  // --- Delivery ---
  deliveryHistEl.innerHTML = '';

      <h3><i class="fas fa-truck"></i> ${p.cliente || 'Cliente'}</h3>
      <p class="muted">#${idx + 1} — ${p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : ''}</p>
      <p><strong>Itens:</strong><br>${
        (p.itens || '').split(';').map(item => {
          const partes = item.split('||');
          const nome = partes[0]?.trim();
          const preco = partes[1]?.trim();
          const obs = partes[2]?.trim();
          return `&nbsp;&nbsp;• ${nome}${preco ? ' — <b>R$ ' + preco + '</b>' : ''}${obs ? ' <em style="color:#aaa">(${obs})</em>' : ''}`;
        }).join('<br>')
      }</p>
      ${p.total ? `<p class="mesa-total">Total: R$ ${p.total}</p>` : ''}
      <button class="btn btn-outline" onclick="window.reimprimirNota('${p.id}')">
        <i class="fas fa-print"></i> Reimprimir
      </button>
    `;
    deliveryHistEl.appendChild(card);
  });
  deliveryTotalEl.textContent = `Total Delivery: R$ ${totalDelivery.toFixed(2).replace('.', ',')}`;
}

window.reimprimirNota = async function (pedidoId) {
  const docRef = doc(db, "pedidos", pedidoId);
  const snap = await getDocs(query(collection(db, "pedidos")));
  const pedido = (await getDocs(query(collection(db, "pedidos")))).docs.find(d => d.id === pedidoId)?.data();

  if (!pedido) {
    Swal.fire('Erro', 'Pedido não encontrado', 'error');
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  pdf.setFontSize(14);
  pdf.text(`Nota - ${pedido.cliente || 'Cliente'}`, 10, 10);
  pdf.text(`Itens: ${pedido.itens || ''}`, 10, 20);
  if (pedido.total) pdf.text(`Total: R$ ${pedido.total}`, 10, 30);
  if (pedido.pagamento) pdf.text(`Pagamento: ${pedido.pagamento}`, 10, 40);
  pdf.text(`Data: ${new Date(pedido.createdAt).toLocaleString('pt-BR')}`, 10, 50);

  pdf.save(`nota-${pedidoId}.pdf`);
};

window.cancelarItemMesa = async function(num, idx) {
  const m = window.mesasState[num];
  if (!m || !m.itens[idx]) return;

  const item = m.itens[idx];

  // Pede senha de gerente
  if (!(await requireManager())) return;

  const { isConfirmed } = await Swal.fire({
    title: 'Cancelar item?',
    html: `<b style="color:#ffbf00">${item.name}</b><br><small>R$ ${item.price.toFixed(2)}</small>`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    confirmButtonText: 'Sim, cancelar',
    cancelButtonText: 'Voltar',
    background: '#1a1a1a',
    color: '#fff'
  });

  if (!isConfirmed) return;

  // Remove o item e recalcula o total
  m.itens.splice(idx, 1);
  m.total = m.itens.reduce((s, i) => s + i.price, 0);
  await saveMesaFirebase(num);

  Swal.fire({ icon: 'success', title: 'Item cancelado!', timer: 900, showConfirmButton: false });
};

  // --- Proteção de Gerente com Olhinho no SweetAlert ---
async function requireManager() {
  const user = auth.currentUser;
  
  const { value: pwd } = await Swal.fire({
    title: 'Senha Gerente',
    background: '#1a1a1a',
    color: '#fff',
    html: `
      <div style="position:relative; width: 100%; margin-top: 15px;">
        <input id="swal-input-password" type="password" class="swal2-input" 
               placeholder="Digite a senha" 
               style="width: 80%; background: #222; color: #fff; border: 1px solid #444;">
        <i id="swal-toggle-password" class="fas fa-eye" 
           style="position:absolute; right:15%; top:50%; transform:translateY(-50%); cursor:pointer; color: #ffbf00; z-index:100; font-size: 18px;"></i>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Confirmar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#ffbf00',
    focusConfirm: false,
    didOpen: () => {
      // Lógica do olhinho dentro do alerta
      const toggleBtn = document.getElementById('swal-toggle-password');
      const pwdInput = document.getElementById('swal-input-password');
      
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleBtn.classList.toggle('fa-eye');
        toggleBtn.classList.toggle('fa-eye-slash');
      });

      // Permitir apertar "Enter" para confirmar
      pwdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') Swal.clickConfirm();
      });
    },
    preConfirm: () => {
      const val = document.getElementById('swal-input-password').value;
      if (!val) {
        Swal.showValidationMessage('Por favor, digite a senha');
      }
      return val;
    }
  });

  if (!pwd) return false;

  try {
    // Re-autentica o usuário para garantir que é o gerente
    await signInWithEmailAndPassword(auth, user.email, pwd);
    return true;
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Erro', text: 'Senha incorreta', background: '#1a1a1a', color: '#fff' });
    return false;
  }
}

// --- Botão Gerar PDF (Versão Corrigida para Cartões e Acentos) ---
document.getElementById('btn-pdf').addEventListener('click', async () => {
  if (!(await requireManager())) return;

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(22);
  pdf.setTextColor(255, 191, 0); 
  pdf.text("BURGUER GRILL", 105, 15, { align: "center" });
  
  pdf.setFontSize(10);
  pdf.setTextColor(100);
  pdf.text(`RELATORIO DE VENDAS E FECHAMENTO`, 105, 21, { align: "center" });
  pdf.setFontSize(9);
  pdf.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 105, 26, { align: "center" });
  
  pdf.setDrawColor(200);
  pdf.line(10, 30, 200, 30);

  let y = 40;
  let totalGeral = 0;
  let totalPix = 0;
  let totalCartao = 0;
  let totalDinheiro = 0;

  const snap = await getDocs(collection(db, 'pedidos'));
  const docs = snap.docs.map(d => d.data())
                       .filter(p => ['venda_mesa', 'delivery', 'retirada', 'fechamento'].includes(p.tipo)) 
                       .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

  docs.forEach((p) => {
    const valor = parseFloat(p.total || 0);
    if (isNaN(valor) || valor <= 0) return;

    totalGeral += valor;

    // Normaliza o texto (remove acentos, maiúsculo)
    const pagTxt = (p.pagamento || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

    // --- SOMA POR MÉTODO ---
    const partesComValor = pagTxt.split('|');
    let temValorExplicito = false;

    partesComValor.forEach(parte => {
      const matchValor = parte.match(/([\d]+[.,][\d]{2})/);
      if (!matchValor) return;
      const val = parseFloat(matchValor[1].replace(',', '.'));
      if (isNaN(val) || val <= 0) return;
      temValorExplicito = true;

      if (parte.includes('PIX')) totalPix += val;
      else if (parte.includes('DIN')) totalDinheiro += val;
      else if (parte.includes('CRED') || parte.includes('DEB') || parte.includes('CART')) totalCartao += val;
    });

    // Formato simples sem valor explícito (ex: vindo do site de delivery)
    if (!temValorExplicito) {
      if (pagTxt.includes('PIX')) totalPix += valor;
      else if (pagTxt.includes('DIN')) totalDinheiro += valor;
      else if (pagTxt.includes('CART') || pagTxt.includes('CRED') || pagTxt.includes('DEB')) totalCartao += valor;
      else totalDinheiro += valor;
    }

    // --- LISTAGEM ---
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(10);
    pdf.setTextColor(40);
    pdf.text(`${p.cliente || 'Venda'} | Garcom: ${p.garcom || "Geral"}`, 10, y);

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(8);
    const dataF = p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : '---';
    pdf.text(`Data: ${dataF}`, 10, y + 5);
    y += 11;

    // Quebra cada método de pagamento em linha separada
    const partesPag = (p.pagamento || "").split('|').map(s => s.trim()).filter(Boolean);

    if (partesPag.length > 1) {
      // Pagamento misto: uma linha por método com seu valor
      partesPag.forEach(parte => {
        const matchValor = parte.match(/([\d]+[.,][\d]{2})/);
        const valParte = matchValor ? parseFloat(matchValor[1].replace(',', '.')) : 0;
        const nomeParte = parte.split(':')[0].trim();

        pdf.setTextColor(80);
        pdf.setFont("helvetica", "normal");
        pdf.text(`  -> ${nomeParte}:`, 12, y);
        if (valParte > 0) {
          pdf.setFont("helvetica", "bold");
          pdf.setTextColor(40);
          pdf.text(`R$ ${valParte.toFixed(2).replace('.', ',')}`, 200, y, { align: "right" });
        }
        y += 5;
        if (y > 275) { pdf.addPage(); y = 20; }
      });

      // Total da venda
      pdf.setFont("helvetica", "bold");
      pdf.setTextColor(20);
      pdf.text(`  TOTAL:`, 12, y);
      pdf.text(`R$ ${valor.toFixed(2).replace('.', ',')}`, 200, y, { align: "right" });
      y += 9;

    } else {
      // Pagamento simples: uma linha só
      const meioSimples = (p.pagamento || "Nao informado").split(':')[0].trim();
      pdf.setTextColor(40);
      pdf.setFont("helvetica", "normal");
      pdf.text(`Meio: ${meioSimples}`, 10, y);
      pdf.setFont("helvetica", "bold");
      pdf.text(`R$ ${valor.toFixed(2).replace('.', ',')}`, 200, y, { align: "right" });
      y += 9;
    }

    // Linha separadora entre vendas
    pdf.setDrawColor(220);
    pdf.line(10, y, 200, y);
    y += 4;

    if (y > 275) { pdf.addPage(); y = 20; }
  });

  // --- RESUMO FINAL ---
  y += 5;
  pdf.setDrawColor(0);
  pdf.line(10, y, 200, y);
  y += 8;
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(11);
  pdf.setTextColor(40);
  pdf.text("RESUMO DE CAIXA POR METODO", 10, y);
  y += 7;
  
  pdf.setFontSize(10);
  pdf.setFont("helvetica", "normal");
  pdf.text(`Total em PIX:`, 15, y); pdf.text(`R$ ${totalPix.toFixed(2).replace('.', ',')}`, 200, y, { align: "right" }); y += 6;
  pdf.text(`Total em Cartoes:`, 15, y); pdf.text(`R$ ${totalCartao.toFixed(2).replace('.', ',')}`, 200, y, { align: "right" }); y += 6;
  pdf.text(`Total em Dinheiro:`, 15, y); pdf.text(`R$ ${totalDinheiro.toFixed(2).replace('.', ',')}`, 200, y, { align: "right" }); y += 12;

  pdf.setFillColor(30, 30, 30);
  pdf.rect(10, y, 190, 12, 'F');
  pdf.setTextColor(255, 191, 0);
  pdf.setFontSize(12);
  pdf.text("FATURAMENTO LIQUIDO TOTAL:", 15, y + 8);
  pdf.setFontSize(14);
  pdf.text(`R$ ${totalGeral.toFixed(2).replace('.', ',')}`, 195, y + 8, { align: "right" });

  pdf.save(`relatorio_financeiro.pdf`);
});

// Função auxiliar para agrupar itens iguais
function agruparItens(itens) {
  const grouped = {};
  itens.forEach(it => {
    const key = it.name + (it.obs || '');
    if (!grouped[key]) {
      grouped[key] = { ...it, qty: 0 };
    }
    grouped[key].qty += 1;
  });
  return Object.values(grouped);
}

window.enviarParaCozinha = async function (num) {
  const m = window.mesasState[num];
  if (!m || m.itens.length === 0) return;

  // Função para criar a assinatura do item
  const gerarChave = (it) => `${it.name}||${it.price}||${it.obs || ''}`;

  // 1. Contabiliza quantas vezes cada chave já foi impressa
  const contagemImpressos = {};
  m.impresso.forEach(c => {
    contagemImpressos[c] = (contagemImpressos[c] || 0) + 1;
  });

  // 2. Filtra apenas o que sobrou (o que é novo ou repetição nova)
  const novosParaImprimir = [];
  const copiaImpressos = [...m.impresso]; // Cópia para atualizar o estado depois

  m.itens.forEach(item => {
    const chave = gerarChave(item);
    if (contagemImpressos[chave] > 0) {
      // Se já imprimiu antes, decrementa a contagem e não adiciona nos "novos"
      contagemImpressos[chave]--;
    } else {
      // Se a contagem acabou ou nunca existiu, é um item novo/repetido
      novosParaImprimir.push(item);
      copiaImpressos.push(chave);
    }
  });

  if (novosParaImprimir.length === 0) {
    Swal.fire({ title: 'Atenção', text: 'Todos os itens atuais já foram enviados!', icon: 'info' });
    return;
  }

  // 3. Agrupa os novos itens para a comanda sair bonita (ex: 2x Coca)
  const agrupados = agruparItens(novosParaImprimir);

  try {
    // 4. Grava no Firestore para o servidor Node.js ler
    await addDoc(collection(db, "pedidos"), {
      tipo: 'mesa',
      cliente: `Mesa ${num}`,
      garcom: m.garcom || 'Geral',
      itens: agrupados.map(i => `${i.qty}x ${i.name}||${(i.price * i.qty).toFixed(2)}||${i.obs || ''}`).join(';'),
      createdAt: new Date().toISOString()
    });

    // 5. Atualiza o estado da mesa com a nova lista de impressos
    m.impresso = copiaImpressos;
    await saveMesaFirebase(num);

    Swal.fire({ icon: 'success', title: 'Cozinha Avisada!', timer: 1000, showConfirmButton: false });
  } catch (error) {
    console.error("Erro ao enviar:", error);
    Swal.fire('Erro', 'Não foi possível enviar para a cozinha', 'error');
  }
};

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <button type="button" onclick="window.acaoAddPagamento('PIX')" class="btn btn-outline">PIX</button>
          <button type="button" onclick="window.acaoAddPagamento('DINHEIRO')" class="btn btn-outline">DINHEIRO</button>
          <button type="button" onclick="window.acaoAddPagamento('DÉBITO')" class="btn btn-outline">DÉBITO</button>
          <button type="button" onclick="window.acaoAddPagamento('CRÉDITO')" class="btn btn-outline">CRÉDITO</button>
        </div>
      </div>
      <div id="swal-lista-pags" style="margin-top:10px; max-height:100px; overflow-y:auto;"></div>
    </div>
  `;

  const { isConfirmed } = await Swal.fire({
    title: 'Acerto de Mesa ' + num,
    html: htmlModal,
    showCancelButton: true,
    confirmButtonText: 'Confirmar Lançamento',
    background: '#1a1a1a',
    color: '#fff',
    didOpen: () => {
        const input = document.getElementById('swal-valor-pago');
        if(input) input.focus();
    }
  });

  if (!isConfirmed || novosPagamentos.length === 0) {
    delete window.acaoAddPagamento;
    delete window.preencherRestante;
    return;
  }

  const totalPagoAgora = novosPagamentos.reduce((acc, cur) => acc + cur.valor, 0);
  const ehFechamentoTotal = (saldoMesa <= 0.05);

  try {
    // 1. Registra no Firebase
    await addDoc(collection(db, "pedidos"), {
      tipo: ehFechamentoTotal ? 'fechamento' : 'venda_mesa',
      cliente: `Mesa ${num}`,
      garcom: m.garcom || "Geral",
      pagamento: novosPagamentos.map(p => `${p.metodo}: R$ ${p.valor.toFixed(2)}`).join(' | '),
      total: totalPagoAgora.toFixed(2),
      
      // CAMPO PARA O GERENTE: Envia o valor pago anteriormente se for o fechamento final
      abatidoAnterior: (ehFechamentoTotal && jaPagoAcumulado > 0) ? jaPagoAcumulado.toFixed(2) : null,
      
      // SE FOR FECHAMENTO TOTAL, ENVIA OS ITENS PARA A IMPRESSORA MOSTRAR O CONSUMO
      itens: ehFechamentoTotal ? m.itens.map(it => `${it.name} || ${it.price.toFixed(2)} || ${it.obs || ''}`).join(';') : "",
      createdAt: new Date().toISOString()
    });

    // 2. Atualiza o estado local da mesa
    if (ehFechamentoTotal) {
      window.mesasState[num] = { status: 'Livre', itens: [], total: 0, pago: 0, impresso: [], garcom: '' };
    } else {
      window.mesasState[num].total = consumoTotalAtual; 
      window.mesasState[num].pago = jaPagoAcumulado + totalPagoAgora;
    }

    await saveMesaFirebase(num);
    if (typeof renderMesas === 'function') renderMesas();
    
    Swal.fire({ icon: 'success', title: 'Pagamento registrado!', timer: 1000, showConfirmButton: false });
  } catch (e) { 
    console.error(e); 
    Swal.fire('Erro', 'Erro ao salvar no banco.', 'error');
  } finally {
    delete window.acaoAddPagamento;
    delete window.preencherRestante;
  }
};

// Função para tocar 3 bips curtos
function tocarBip() {
  if (!window.bipAtivo) return;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  for (let i = 0; i < 1; i++) {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime + i * 0.4);
    osc.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.4);
    osc.stop(audioCtx.currentTime + i * 0.4 + 0.2);
  }
}

// Formata o input em tempo real (R$ 0,00)
window.mascaraMoeda = function(i) {
  let v = i.value.replace(/\D/g, '');
  v = (v / 100).toFixed(2).replace(".", ",");
  v = v.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
  v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
  i.value = "R$ " + v;
};

  const tipo = document.getElementById('staff-tipo').value;
  const divFunc = document.getElementById('field-funcionario');
  const divDesp = document.getElementById('field-despesa');
  
  if (tipo === 'consumo') {
    divFunc.style.display = 'block';
    divDesp.style.display = 'none';

    divDesp.style.display = 'block';

};

// Salvar Lançamento
window.lancarLocal = function() {
  const tipo = document.getElementById('staff-tipo').value;
  const listaAtual = JSON.parse(localStorage.getItem('burguer_staff') || '[]');
  
  let novoItem = {
    id: Date.now(),
    tipo: tipo
  };

  if (tipo === 'consumo') {
    const itemRaw = document.getElementById('staff-item').value;
    const funcNome = document.getElementById('staff-nome').value;
    if (!itemRaw) return Swal.fire('Erro', 'Selecione um item', 'error');
    
    const [nomeItem, precoItem] = itemRaw.split('||');
    novoItem.desc = `Funcionário: ${funcNome} (${nomeItem})`;
    novoItem.valor = parseFloat(precoItem);
  } else {
    const desc = document.getElementById('staff-desc').value;
    const valorF = document.getElementById('staff-valor-formatado').value;
    
    // Converte "R$ 1.250,50" -> 1250.50
    const valorNumerico = parseFloat(valorF.replace("R$ ", "").replace(/\./g, "").replace(",", "."));

    if (!desc || isNaN(valorNumerico) || valorNumerico <= 0) {
      return Swal.fire('Erro', 'Preencha a descrição e o valor corretamente', 'error');
    }

    novoItem.desc = `DESPESA: ${desc}`;
    novoItem.valor = valorNumerico;
  }

  listaAtual.push(novoItem);
  localStorage.setItem('burguer_staff', JSON.stringify(listaAtual));
  
  // Limpar campos de despesa
  document.getElementById('staff-desc').value = '';
  document.getElementById('staff-valor-formatado').value = '';
  
  renderStaffLocal();
  
  const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 });
  Toast.fire({ icon: 'success', title: 'Lançado com sucesso!' });
};

// Renderizar lista e somar totais
window.renderStaffLocal = function() {
  const lista = document.getElementById('staff-local-list');
  const totalEl = document.getElementById('staff-local-total');
  if (!lista || !totalEl) return;

  const dados = JSON.parse(localStorage.getItem('burguer_staff') || '[]');
  
  lista.innerHTML = '';
  let totalConsumo = 0;
  let totalDespesa = 0;

  if (dados.length === 0) {
    lista.innerHTML = '<div class="muted" style="text-align:center; padding:20px;">Carrinho vazio.</div>';
    totalEl.innerHTML = "Consumo: R$ 0,00 | Despesas: R$ 0,00";
    return;
  }

  dados.forEach((item, index) => {
    const valor = parseFloat(item.valor) || 0;
    if (item.tipo === 'consumo') totalConsumo += valor; else totalDespesa += valor;

    const bordaCor = item.tipo === 'consumo' ? '#ffbf00' : '#ff4444';
    const icone = item.tipo === 'consumo' ? '🍴' : '💸';

    lista.innerHTML += `
      <div style="display:flex; justify-content:space-between; align-items:center; background:#222; padding:10px; margin-bottom:8px; border-radius:5px; border-left: 5px solid ${bordaCor};">
        <div style="flex:1">
          <small style="color:#888;">${new Date(item.id).toLocaleTimeString('pt-BR')}</small><br>
          <span style="font-size: 0.9rem;">${icone} <strong>${item.desc}</strong></span>
        </div>
        <div style="text-align:right; margin-right:15px; min-width:95px;">
          <strong style="color:#fff">R$ ${valor.toFixed(2).replace('.', ',')}</strong>
        </div>
        <button class="btn btn-danger" style="padding:4px 10px; font-size:12px; min-width:auto;" onclick="removerItemStaffLocal(${index})">
          <i class="fas fa-times"></i>
        </button>
      </div>
    `;
  });

  totalEl.innerHTML = `
    <div style="display:flex; justify-content:space-between; width:100%; padding: 5px 10px; font-size:0.9rem;">
      <span>Consumo Funcionário: <strong style="color:#ffbf00">R$ ${totalConsumo.toFixed(2).replace('.', ',')}</strong></span>
      <span>Despesas: <strong style="color:#ff4444">R$ ${totalDespesa.toFixed(2).replace('.', ',')}</strong></span>
    </div>
    <div style="text-align:center; margin-top:8px; border-top: 1px solid #444; padding-top:8px;">
      Total Interno: <strong style="font-size:1.1rem;">R$ ${(totalConsumo + totalDespesa).toFixed(2).replace('.', ',')}</strong>
    </div>
  `;
};

// Remover Item Único
window.removerItemStaffLocal = function(index) {
  const atual = JSON.parse(localStorage.getItem('burguer_staff') || '[]');
  atual.splice(index, 1);
  localStorage.setItem('burguer_staff', JSON.stringify(atual));
  renderStaffLocal();
};

// Limpar Tudo
window.limparStaffLocal = async function() {
  const { isConfirmed } = await Swal.fire({
    title: 'Zerar Relatório Interno?',
    text: "Isso apagará todos os consumos e despesas desta aba!",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    confirmButtonText: 'Sim, apagar tudo!',
    background: '#1a1a1a',
    color: '#fff'
  });

  if (isConfirmed) {
    localStorage.removeItem('burguer_staff');
    renderStaffLocal();
  }
};
window.gerarPDFStaffLocal = function() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  const dados = JSON.parse(localStorage.getItem('burguer_staff') || '[]');
  
  if (dados.length === 0) {
    return Swal.fire('Aviso', 'Não há dados para gerar o PDF!', 'info');
  }

  const hoje = new Date().toLocaleDateString('pt-BR');
  const hora = new Date().toLocaleTimeString('pt-BR');

  // Cabeçalho Estilizado
  pdf.setFillColor(30, 30, 30);
  pdf.rect(0, 0, 210, 35, 'F');
  pdf.setTextColor(255, 191, 0);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(20);
  pdf.text("BURGUER GRILL", 105, 15, { align: "center" });
  
  pdf.setTextColor(255, 255, 255);
  pdf.setFontSize(10);
  pdf.text("RELATÓRIO DE CONSUMO INTERNO E DESPESAS", 105, 23, { align: "center" });
  pdf.text(`Gerado em: ${hoje} às ${hora}`, 105, 29, { align: "center" });

  let y = 45;
  let totalC = 0;
  let totalD = 0;

  // Linhas do Relatório
  pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(11);

  dados.forEach((item, index) => {
    // Alternar cor de fundo suave para leitura
    if (index % 2 === 0) {
      pdf.setFillColor(245, 245, 245);
      pdf.rect(10, y - 5, 190, 10, 'F');
    }

    const valor = parseFloat(item.valor) || 0;
    if (item.tipo === 'consumo') totalC += valor; else totalD += valor;

    pdf.setFont("helvetica", "bold");
    pdf.text(item.desc, 15, y);
    
    pdf.setFont("helvetica", "normal");
    pdf.text(`R$ ${valor.toFixed(2).replace('.', ',')}`, 195, y, { align: "right" });

    y += 10;

    // Nova página se necessário
    if (y > 270) {
      pdf.addPage();
      y = 20;
    }
  });

  // Resumo Final
  y += 10;
  pdf.setDrawColor(200);
  pdf.line(10, y, 200, y);
  y += 10;

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(12);
  pdf.text("RESUMO FINANCEIRO:", 10, y);
  y += 8;

  pdf.setFont("helvetica", "normal");
  pdf.text(`Total Consumo Staff:`, 15, y);
  pdf.text(`R$ ${totalC.toFixed(2).replace('.', ',')}`, 195, y, { align: "right" });
  y += 6;

  pdf.text(`Total Despesas Diversas:`, 15, y);
  pdf.text(`R$ ${totalD.toFixed(2).replace('.', ',')}`, 195, y, { align: "right" });
  y += 10;

  // Total Geral Destacado
  pdf.setFillColor(255, 191, 0);
  pdf.rect(10, y, 190, 12, 'F');
  pdf.setTextColor(0);
  pdf.setFont("helvetica", "bold");
  pdf.text("CUSTO TOTAL INTERNO:", 15, y + 8);
  pdf.text(`R$ ${(totalC + totalD).toFixed(2).replace('.', ',')}`, 195, y + 8, { align: "right" });

  // Nome do arquivo com data
  const nomeArquivo = `Relatorio_Interno_${hoje.replace(/\//g, '-')}.pdf`;
  pdf.save(nomeArquivo);
};

// BUSCAR MENU
window.filtrarMenu = function(termo) {
  // 1. Normaliza o termo de busca (tira acentos e deixa minúsculo)
  const busca = termo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const itens = document.querySelectorAll('.menu-item');
  const secoes = document.querySelectorAll('.menu-section');

  // 2. Filtra os itens individualmente
  itens.forEach(item => {
    const nome = item.querySelector('h4').innerText.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    item.style.display = nome.includes(busca) ? 'flex' : 'none';
  });

  // 3. Gerencia a visibilidade das seções (categorias)
  secoes.forEach(secao => {
    const listaItens = secao.querySelector('.menu-items');
    const btnToggle = secao.querySelector('.toggle');
    
    // Verifica se existe algum item visível nesta seção
    const temVisivel = Array.from(secao.querySelectorAll('.menu-item')).some(i => i.style.display === 'flex');

    if (busca === "") {
      // --- ESTADO NORMAL: Se a busca estiver vazia, volta ao padrão fechado ---
      secao.style.display = 'block';
      if (listaItens) listaItens.classList.remove('show'); // Esconde a lista
      if (btnToggle) btnToggle.textContent = '+';          // Volta o ícone para +
    } else {
      // --- ESTADO DE BUSCA: Mostra apenas se tiver o que o usuário quer ---
      if (temVisivel) {
        secao.style.display = 'block';
        if (listaItens) listaItens.classList.add('show'); // Abre automaticamente
        if (btnToggle) btnToggle.textContent = '−';       // Muda ícone para -
      } else {
        secao.style.display = 'none'; // Esconde a categoria se não tiver o item
      }
    }
  });
};
