<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Painel — BURGUER GRILL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="meu-favicon.ico" type="image/x-icon">
  <style>
    /* ==================== VARIÁVEIS ==================== */
    :root {
      --bg:      #121212;
      --card:    #1e1e1e;
      --border:  #333;
      --accent:  #ffbf00;
      --danger:  #d32f2f;
      --success: #25d366;
      --text:    #eee;
      --muted:   #aaa;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      margin: 0;
    }

    /* ==================== LOGIN ==================== */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #login-screen input {
      width: 280px;
      margin: 8px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
    }

    .password-container {
      position: relative;
      width: 280px;
      margin: 8px auto;
    }

    .password-container input {
      width: 100%;
      padding: 10px 40px 10px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      margin: 0;
    }

    #toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
    }

    #toggle-password:hover { color: var(--accent); }

    /* ==================== LAYOUT GERAL ==================== */
    header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ==================== SIDEBAR ==================== */
    #sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #1a1a1a;
      border-right: 1px solid var(--border);
      z-index: 1000;
      transition: 0.3s;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    #sidebar.open { left: 0; }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 999;
    }

    .sidebar-overlay.active { display: block; }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .sidebar-btn {
      background: #222;
      color: #fff;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      width: 100%;
    }

    .sidebar-btn:hover { background: var(--accent); color: #000; }

    /* ==================== ABAS ==================== */
    .tabs, .subtabs {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .subtabs {
      padding: 0;
      border-bottom: none;
      margin-bottom: 12px;
    }

    .tab-btn, .subtab-btn {
      background: #222;
      color: var(--accent);
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .subtab-btn { padding: 8px 12px; border-radius: 6px; }

    .tab-btn.active, .subtab-btn.active {
      background: var(--accent);
      color: #000;
    }

    .tab, .subtab { display: none; }
    .tab.active, .subtab.active { display: block; }
    .tab { padding: 16px 20px; }

    /* ==================== GRIDS E CARDS ==================== */
    .grid, .mesas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card, .mesa-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .mesa-card {
      position: relative;
      transition: border-color .2s, transform .2s, box-shadow .2s, opacity .2s;
    }

    .mesa-card.livre   { border-color: var(--success); }
    .mesa-card.ocupada { border-color: var(--danger); }

    .mesa-items {
      border-top: 1px dashed var(--border);
      margin-top: 8px;
      padding-top: 8px;
      max-height: 80px;
      overflow-y: auto;
      border-bottom: 1px dashed #444;
      margin-bottom: 5px;
    }

    .mesa-total, .hist-total {
      margin-top: 8px;
      font-weight: bold;
      color: var(--accent);
    }

    /* ==================== DESTAQUE DE MESA ==================== */
    .mesa-card.highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.02);
    }

    /* ==================== BOTÃO FLUTUANTE ==================== */
    #floating-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 12px 16px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      cursor: pointer;
      display: none;
    }

    /* ==================== BOTÕES ==================== */
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-accent  { background: var(--accent);  color: #000; }
    .btn-outline { background: #222; color: var(--accent); border: 1px solid var(--accent); }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-success { background: var(--success); color: #fff; }

    /* ==================== MODAL ==================== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      overflow: auto;
    }

    .modal-content {
      max-width: 900px;
      margin: 40px auto;
      background: #1a1a1a;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* ==================== CARDÁPIO NO MODAL ==================== */
    .menu-section {
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .menu-section-header {
      background: #222;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-section-header h3 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .menu-section-header .toggle {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .menu-items { display: none; padding: 10px 12px; background: #1f1f1f; }
    .menu-items.show { display: block; }

    .menu-item {
      background: #222;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .menu-item h4 {
      margin: 0 0 2px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .menu-item small {
      font-size: 1rem;
      font-weight: 700;
      color: #00ff00;
    }

    .carrinho-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* ==================== INPUTS ==================== */
    select, input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
      background: #222;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }

    /* ==================== DELIVERY CARDS ==================== */
    .dcard {
      position: relative;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12) !important;
      border-radius: 16px !important;
      overflow: hidden;
    }

    .dcard::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .dcard-delivery::before { background: linear-gradient(90deg, #3b82f6, #6366f1); }
    .dcard-retirada::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }
    .dcard-mesa::before     { background: linear-gradient(90deg, #25d366, #059669); }

    .dcard-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .dcard-nome { font-size: 17px; font-weight: 500; color: #fff; margin: 0 0 2px; }
    .dcard-num  { font-size: 12px; color: #888; }

    .dcard-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .dcard-badge-delivery { background: rgba(59,130,246,0.15);  color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .dcard-badge-retirada { background: rgba(245,158,11,0.15);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    .dcard-badge-mesa     { background: rgba(37,211,102,0.15);  color: #6ee7b7; border: 1px solid rgba(37,211,102,0.3); }

    .dcard-info-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    .dcard-icon { font-size: 12px; width: 16px; flex-shrink: 0; margin-top: 2px; }

    .dcard-pag-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #aaa;
      margin-bottom: 10px;
    }

    .dcard-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }

    .dcard-itens { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }

    .dcard-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .dcard-item-nome  { color: #eee; flex: 1; }
    .dcard-item-obs   { font-size: 11px; color: #888; }
    .dcard-item-preco { font-size: 13px; font-weight: 500; color: #6ee7b7; flex-shrink: 0; margin-left: 8px; }

    .dcard-footer { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px; }
    .dcard-total-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .dcard-total-valor { font-size: 22px; font-weight: 500; color: #34d399; line-height: 1; }
    .dcard-hora { font-size: 11px; color: #888; text-align: right; }

    /* ==================== SWEETALERT FIXES ==================== */
    .swal2-container { z-index: 10000 !important; }
    .swal2-radio label { color: #000 !important; }

    /* ==================== OVERLAY SITE FECHADO ==================== */
    /* (Esse overlay fica no index2.html, mas o botão fica aqui) */

    /* ==================== RESPONSIVO ==================== */
    @media (max-width: 1024px) {
      .grid, .mesas-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .grid, .mesas-grid { grid-template-columns: 1fr; }
      .btn { padding: 10px 12px; }
    }
    /* ===== ESTOQUE ===== */
#estoque-tab .est-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.est-item {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: border-color .2s;
}
.est-item.esgotado { border-color: #d32f2f; background: rgba(211,47,47,0.08); }
.est-item-nome { font-size: .85rem; font-weight: 600; flex: 1; line-height: 1.3; }
.est-toggle {
  width: 42px; height: 24px;
  background: #444; border-radius: 999px;
  position: relative; cursor: pointer;
  border: none; flex-shrink: 0;
  transition: background .2s;
}
.est-toggle::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 18px; height: 18px;
  background: #fff; border-radius: 50%;
  transition: left .2s;
}
.est-item.esgotado .est-toggle { background: #d32f2f; }
.est-item.esgotado .est-toggle::after { left: 21px; }
.est-cat-title {
  grid-column: 1 / -1;
  font-size: .7rem; font-weight: 700;
  color: var(--accent); letter-spacing: 2px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px; margin-top: 8px;
}
  </style>
</head>
<body>

<!-- ==================== TELA DE LOGIN ==================== -->
<div id="login-screen">
  <h2 style="color:#ffbf00; margin-bottom:20px;">
    <i class="fas fa-hamburger"></i> BURGUER GRILL
  </h2>
  <div style="background:#1e1e1e; border:1px solid #333; border-radius:12px; padding:30px; width:300px;">
    <h3 style="margin:0 0 20px; text-align:center; color:#eee;">
      <i class="fas fa-lock"></i> Acesso ao Painel
    </h3>
    <div class="password-container" style="margin:0 0 16px;">
      <input id="login-password" type="password" placeholder="Digite sua senha" style="width:80%;">
      <i id="toggle-password" class="fas fa-eye"></i>
    </div>
    <button id="btn-login" class="btn btn-accent" style="width:100%;">
      <i class="fas fa-sign-in-alt"></i> Entrar
    </button>
    <div id="login-error" style="margin-top:10px; color:var(--danger); text-align:center; font-size:.9rem;"></div>
  </div>
</div>

<!-- ==================== PAINEL PRINCIPAL ==================== -->
<div id="main-panel" style="display:none;">

  <!-- Overlay da sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="color:var(--accent); margin:0;">Menu</h3>
      <button onclick="toggleSidebar()" style="background:none; border:none; color:#fff; font-size:25px; cursor:pointer;">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <button id="btn-pdf" class="sidebar-btn">
        <i class="fas fa-file-pdf"></i> Baixar PDF Vendas
      </button>
      <button id="btn-bip" class="sidebar-btn">
        <i class="fas fa-bell"></i> Bip: ON
      </button>
      <button id="btn-alterar-senha" class="sidebar-btn">
  <i class="fas fa-key"></i> Alterar Senha Gerente
</button>
      <!-- <a href="index2.html" style="text-decoration:none;">
        <button class="sidebar-btn"><i class="fas fa-utensils"></i> Ir para Menu</button>
      </a> -->

      <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">

      <!-- Fechar / Abrir site -->
      <button id="btn-fechar-site" class="sidebar-btn" style="color:#ff4444;">
        <i class="fas fa-power-off"></i> Fechar Site
      </button>
      <button id="btn-abrir-site" class="sidebar-btn" style="color:var(--success);">
        <i class="fas fa-power-off"></i> Abrir Site
      </button>

      <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">

      <button id="btn-apagar-tudo" class="sidebar-btn" style="color:var(--danger);">
        <i class="fas fa-trash"></i> Apagar Vendas
      </button>
      <button id="btn-logout" class="sidebar-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </nav>
  </div>

  <!-- Header -->
  <header>
    <button onclick="toggleSidebar()" class="btn btn-outline" style="min-width:auto; padding:10px 15px;">
      <i class="fas fa-bars"></i>
    </button>
    <h1><i class="fas fa-receipt"></i> Painel — BURGUER GRILL</h1>
  </header>

  <!-- Abas principais -->
  <div class="tabs">
    <button class="tab-btn active" onclick="openTab('delivery')">
      <i class="fas fa-truck"></i> Pedidos/Mesas
    </button>
    <button class="tab-btn" onclick="openTab('mesas')">
      <i class="fas fa-chair"></i> Mesas
    </button>
    <button class="tab-btn" onclick="openTab('staff')">
      <i class="fas fa-users"></i> Funcionários & Despesas
    </button>
    <button class="tab-btn" onclick="openTab('estoque')">
  <i class="fas fa-boxes"></i> Estoque
    </button>
  </div>

  <!-- ===== ABA: PEDIDOS ===== -->
  <section id="delivery" class="tab active">
    <div class="subtabs">
      <button class="subtab-btn active" onclick="openSubtab('delivery-list')">Pedidos</button>
      <button class="subtab-btn" onclick="openSubtab('delivery-hist')">Histórico</button>
    </div>

    <div id="delivery-list" class="subtab active">
      <div class="grid" id="orders-grid"></div>
      <div id="orders-count" style="margin-top:8px; color:var(--muted);"></div>
    </div>

    <div id="delivery-hist" class="subtab">
      <div class="hist-list" id="delivery-historico"></div>
      <div id="delivery-total" class="mesa-total" style="margin-top:10px;"></div>
    </div>
  </section>

  <!-- ===== ABA: MESAS ===== -->
  <section id="mesas" class="tab">
    <div class="subtabs">
      <button class="subtab-btn active" onclick="openSubtab('mesas-controle')">Controle</button>
      <button class="subtab-btn" onclick="openSubtab('mesas-hist')">Histórico</button>
    </div>

    <div id="mesas-controle" class="subtab active">
      <div class="mesas-grid" id="mesas-grid"></div>
    </div>

    <div id="mesas-hist" class="subtab">
      <div class="hist-list" id="mesas-historico"></div>
      <div id="mesas-total" class="mesa-total" style="margin-top:10px;"></div>
    </div>
  </section>

  <!-- ===== ABA: STAFF ===== -->
  <section id="staff" class="tab">
    <div class="grid" style="grid-template-columns: 1fr 1.5fr; gap: 20px;">

      <!-- Formulário de lançamento -->
      <div class="card">
        <h3><i class="fas fa-edit"></i> Registrar Movimentação</h3>

        <label>Tipo de Lançamento:</label>
        <select id="staff-tipo" style="width:100%; margin:10px 0;" onchange="toggleStaffFields()">
          <option value="consumo">Consumo de Funcionário</option>
          <option value="despesa">Despesa Diversa (Saída de Caixa)</option>
        </select>

        <div id="field-funcionario">
          <label>Funcionário:</label>
          <select id="staff-nome" style="width:100%; margin-bottom:10px;">
            <option>Ana</option><option>Mônica</option><option>Vitória</option>
            <option>Lorrane</option><option>Michely</option><option>Renato</option>
            <option>Ingrid</option><option>Simone</option><option>Luciano</option>
          </select>
          <label>Produto Consumido:</label>
          <select id="staff-item" style="width:100%;"></select>
        </div>

        <div id="field-despesa" style="display:none;">
          <label>O que foi comprado?</label>
          <input id="staff-desc" type="text" placeholder="Ex: Gelo, Coentro..." style="width:100%; margin-bottom:10px;">
          <label>Valor da Despesa:</label>
          <input id="staff-valor-formatado" type="text" placeholder="R$ 0,00" style="width:100%;" oninput="mascaraMoeda(this)">
        </div>

        <button class="btn btn-accent" style="width:100%; margin-top:20px;" onclick="lancarLocal()">
          <i class="fas fa-check"></i> Confirmar Lançamento
        </button>
      </div>

      <!-- Resumo interno -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3>Resumo Interno</h3>
          <div style="display:flex; gap:5px;">
            <button class="btn btn-danger" onclick="limparStaffLocal()"><i class="fas fa-trash-alt"></i></button>
            <button class="btn btn-outline" onclick="gerarPDFStaffLocal()"><i class="fas fa-file-pdf"></i></button>
          </div>
        </div>
        <div id="staff-local-list"></div>
        <div id="staff-local-total" class="mesa-total" style="margin-top:15px;"></div>
      </div>

    </div>
  </section>
<!-- ===== ABA: ESTOQUE ===== -->
<section id="estoque-tab" class="tab" style="padding:16px 20px;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
    <h3 style="margin:0; color:var(--accent);"><i class="fas fa-boxes"></i> Controle de Estoque</h3>
    <button class="btn btn-danger" onclick="zerarEstoque()" style="font-size:.8rem; padding:6px 12px;">
      <i class="fas fa-redo"></i> Tudo disponível
    </button>
  </div>
  <p style="color:var(--muted); font-size:.82rem; margin-bottom:4px;">
    Clique no botão para marcar como <b style="color:#d32f2f;">Esgotado</b> — aparece imediatamente no cardápio.
  </p>
  <div class="est-grid" id="est-grid"></div>
</section>
</div><!-- fim #main-panel -->

<!-- Botão flutuante para voltar visão geral das mesas -->
<button id="floating-toggle"><i class="fas fa-layer-group"></i> Ver todas as mesas</button>

<!-- ==================== MODAL: MENU DA MESA ==================== -->
<div id="menu-modal" class="modal">
  <div class="modal-content">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">

function renderEstoque() {
  const grid = document.getElementById('est-grid');
  if (!grid) return;
  grid.innerHTML = '';
  const cats = [...new Set(menuDataEstoque.map(i => i.cat))];
  cats.forEach(cat => {
    const titleEl = document.createElement('div');
    titleEl.className = 'est-cat-title';
    titleEl.textContent = cat;
    grid.appendChild(titleEl);
    menuDataEstoque.filter(i => i.cat === cat).forEach(item => {
      const esg = window.esgotados.has(item.id);
      const div = document.createElement('div');
      div.className = `est-item${esg ? ' esgotado' : ''}`;
      div.id = `est-item-${item.id}`;
      div.innerHTML = `
        <span class="est-item-nome">${item.name}</span>
        <button class="est-toggle" title="${esg?'Marcar disponível':'Marcar esgotado'}"
                onclick="toggleEstoque(${item.id})"></button>`;
      grid.appendChild(div);
    });
  });
}

window.toggleEstoque = async function(id) {
  if (window.esgotados.has(id)) window.esgotados.delete(id);
  else window.esgotados.add(id);
  // Atualiza UI imediatamente (sem esperar Firestore)
  const el = document.getElementById(`est-item-${id}`);
  if (el) el.className = `est-item${window.esgotados.has(id) ? ' esgotado' : ''}`;
  // Grava 1 único documento no Firestore
  await setDoc(doc(db, 'config', 'estoque'), { esgotados: [...window.esgotados] });
};

window.zerarEstoque = async function() {
  const { isConfirmed } = await Swal.fire({
    title: 'Marcar tudo como disponível?',
    icon: 'question', showCancelButton: true,
    confirmButtonText: 'Sim', background: '#1a1a1a', color: '#fff'
  });
  if (!isConfirmed) return;
  window.esgotados.clear();
  await setDoc(doc(db, 'config', 'estoque'), { esgotados: [] });
  renderEstoque();
};

// Listener em tempo real no painel (1 doc, custo mínimo)
onSnapshot(doc(db, 'config', 'estoque'), snap => {
  if (snap.exists()) {
    window.esgotados = new Set(snap.data().esgotados || []);
  } else {
    window.esgotados = new Set();
  }
  renderEstoque();
});

/** Tocar bip de notificação */
function tocarBip() {
  if (!window.bipAtivo) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1000, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch (_) {}
}

/** Máscara de moeda R$ */
window.mascaraMoeda = function(input) {
  let v = input.value.replace(/\D/g, '');
  v = (v / 100).toFixed(2).replace('.', ',');
  v = v.replace(/(\d)(\d{3}),/, '$1.$2,');
  input.value = 'R$ ' + v;
};

/** Formatar float para string BR */
function brl(val) {
  return Number(val || 0).toFixed(2).replace('.', ',');
}

/** Agrupar itens iguais (para comanda) */
function agruparItens(itens) {
  const m = {};
  itens.forEach(it => {
    const k = it.name + '||' + (it.obs || '');
    if (!m[k]) m[k] = { ...it, qty: 0 };
    m[k].qty++;
  });
  return Object.values(m);
}

/** Salvar estado de mesa no Firebase */
async function salvarMesa(num) {
  const m = window.mesasState[num];
  if (m && m.status === 'Ocupada') {
    await setDoc(doc(db, 'mesasAtivas', String(num)), m);
  } else {
    await deleteDoc(doc(db, 'mesasAtivas', String(num)));
  }
}

    confirmButtonText: 'Confirmar',
    confirmButtonColor: '#ffbf00',
    cancelButtonText: 'Cancelar',
    focusConfirm: false,
    didOpen: () => {
      const eye = document.getElementById('swal-eye');
      const inp = document.getElementById('swal-pwd');
      eye.addEventListener('click', () => {
        inp.type = inp.type === 'password' ? 'text' : 'password';
        eye.classList.toggle('fa-eye');
        eye.classList.toggle('fa-eye-slash');
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') Swal.clickConfirm(); });
    },
    preConfirm: () => {
      const v = document.getElementById('swal-pwd').value;
      if (!v) Swal.showValidationMessage('Digite a senha');
      return v;
    }
  });

  if (!pwd) return false;

  if (pwd !== senhaCorreta) {
    Swal.fire({ icon: 'error', title: 'Senha incorreta', background: '#1a1a1a', color: '#fff' });
    return false;
  }
  return true;
}

async function alterarSenhaGerente() {
  const senhaDoc = await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js")
    .then(m => m.getDoc(doc(db, 'config', 'senhaGerente')));
  const senhaAtual = senhaDoc.exists() ? senhaDoc.data().senha : '1234';

  const { value: formValues } = await Swal.fire({
    title: 'Alterar Senha do Gerente',
    background: '#1a1a1a', color: '#fff',
    html: `
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
        <input id="swal-senha-atual" type="password" placeholder="Senha atual"
               style="padding:10px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; width:100%;">
        <input id="swal-senha-nova" type="password" placeholder="Nova senha"
               style="padding:10px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; width:100%;">
        <input id="swal-senha-confirm" type="password" placeholder="Confirmar nova senha"
               style="padding:10px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; width:100%;">
      </div>`,
    showCancelButton: true,
    confirmButtonText: 'Salvar',
    confirmButtonColor: '#ffbf00',
    cancelButtonText: 'Cancelar',
    focusConfirm: false,
    preConfirm: () => {
      const atual   = document.getElementById('swal-senha-atual').value;
      const nova    = document.getElementById('swal-senha-nova').value;
      const confirm = document.getElementById('swal-senha-confirm').value;
      if (atual !== senhaAtual) { Swal.showValidationMessage('Senha atual incorreta!'); return false; }
      if (!nova || nova.length < 3) { Swal.showValidationMessage('Nova senha muito curta!'); return false; }
      if (nova !== confirm) { Swal.showValidationMessage('As senhas não coincidem!'); return false; }
      return nova;
    }
  });

  if (!formValues) return;

  await setDoc(doc(db, 'config', 'senhaGerente'), { senha: formValues });
  Swal.fire({ icon: 'success', title: 'Senha alterada!', timer: 1200, showConfirmButton: false, background: '#1a1a1a', color: '#fff' });
}

function renderMesas() {

  grid.innerHTML = '';

    const m = window.mesasState[i] || { status:'Livre', itens:[], total:0, pago:0, impresso:[], garcom:'' };
    const livre = m.status === 'Livre';

    card.className = `card mesa-card ${livre ? 'livre' : 'ocupada'}`;
    card.setAttribute('data-mesa', i);

    card.innerHTML = `
      ${!livre ? `
        <button onclick="cancelarAberturaMesa(${i})"
          style="position:absolute;top:8px;right:8px;background:#ff4444;color:#fff;border:none;
                 border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:bold;
                 z-index:10;display:flex;align-items:center;justify-content:center;font-size:14px;">×</button>

      <h3><i class="fas fa-chair"></i> Mesa ${i}</h3>
      <div style="color:var(--muted);">Status: <span>${m.status}</span></div>

      <div style="margin:8px 0;">
  <label style="font-weight: bold; color: #ffbf00; display: block; margin-bottom: 4px;">
    <i class="fas fa-user-tie"></i> Atendente:
  </label>
  <select id="mesa-garcom-${i}" ${!livre ? 'disabled' : ''} onchange="selecionarGarcom(${i}, this.value)" style="width:100%; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 5px;">
    <option value="">-- selecione --</option>
    ${['Mônica','Vitória','Lorrany','Michely','Ana','Luciano'].map(g =>
      `<option value="${g}" ${m.garcom===g?'selected':''}>${g}</option>`
    ).join('')}
  </select>
</div>

      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:8px 0;">
        <button class="btn btn-success" onclick="abrirMesa(${i})"><i class="fas fa-door-open"></i> Abrir</button>
        <button class="btn btn-accent"  onclick="abrirMenuMesa(${i})"><i class="fas fa-plus"></i> Itens</button>
        <button class="btn btn-outline" onclick="enviarParaCozinha(${i})"><i class="fas fa-print"></i> Cozinha</button>
        <button class="btn btn-danger"  onclick="fecharMesa(${i})"><i class="fas fa-wallet"></i> Pagar</button>

        ${m.itens.map((it, idx) => `
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:.85rem;padding:2px 0;border-bottom:1px solid #2a2a2a;">
            <span>• ${it.name}${it.obs ? ` <em style="color:#aaa">(${it.obs})</em>` : ''} — R$ ${brl(it.price)}</span>
            <button onclick="cancelarItemMesa(${i},${idx})"
              style="background:transparent;border:1px solid #d32f2f;color:#d32f2f;border-radius:4px;
                     padding:1px 6px;cursor:pointer;font-size:.7rem;flex-shrink:0;margin-left:6px;">✕</button>
          </div>
        `).join('')}
      </div>

      <div style="display:flex;justify-content:space-between;align-items:flex-end;padding:10px;
                  background:rgba(0,0,0,.2);border-radius:8px;margin-top:5px;">
        <div style="font-size:.8rem;color:#aaa;line-height:1.4;">
          Consumo: R$ ${brl(m.total)}<br>
          Pago: <span style="color:#00ff00;">- R$ ${brl(m.pago)}</span>
        </div>
        <div style="text-align:right;">
          <span style="font-size:.75rem;color:#ff4444;font-weight:bold;text-transform:uppercase;">Falta Pagar</span><br>
          <strong style="font-size:1.4rem;color:#ff4444;">
            R$ ${brl(Math.max(0, (m.total||0) - (m.pago||0)))}

    card.addEventListener('click', e => {
      if (e.target.closest('button') || e.target.closest('select')) return;

    });

    grid.appendChild(card);
  }

   7. MESAS – AÇÕES

window.selecionarGarcom = function(num, nome) {
  if (!window.mesasState[num]) window.mesasState[num] = { status:'Livre', itens:[], total:0, pago:0, impresso:[], garcom:'' };
  if (window.mesasState[num].status === 'Ocupada') return;
  window.mesasState[num].garcom = nome;
};

window.abrirMesa = async function(num) {
  if (window.mesasState[num]?.status === 'Ocupada') {
    Swal.fire({ icon:'error', title:'Mesa já ocupada', background:'#1a1a1a', color:'#fff' });
    return;
  }
  const g = document.getElementById(`mesa-garcom-${num}`)?.value;
  if (!g) { Swal.fire({ icon:'warning', title:'Selecione um garçom', background:'#1a1a1a', color:'#fff' }); return; }

  window.mesasState[num] = { status:'Ocupada', itens:[], total:0, pago:0, impresso:[], garcom:g };
  await salvarMesa(num);
  setHighlightMesa(num);
};

window.cancelarAberturaMesa = async function(num) {
  const m = window.mesasState[num];
  if (!m || m.status === 'Livre') return;

  if (m.itens && m.itens.length > 0) {
    const { isConfirmed } = await Swal.fire({
      title: 'Mesa com consumo!',
      text: 'Somente o gerente pode cancelar uma mesa com itens.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Chamar Gerente',
      cancelButtonText: 'Voltar',
      background: '#1a1a1a', color: '#fff'
    });
    if (!isConfirmed) return;
    if (!(await requireManager())) return;
  }

  window.mesasState[num] = { status:'Livre', itens:[], total:0, pago:0, impresso:[], garcom:'' };
  await salvarMesa(num);
  if (window.highlightMesa === num) clearHighlight();
  Toast.fire({ icon:'success', title:'Mesa liberada!' });
};

window.cancelarItemMesa = async function(num, idx) {
  const m = window.mesasState[num];
  if (!m || !m.itens[idx]) return;
  if (!(await requireManager())) return;

  const item = m.itens[idx];
  const { isConfirmed } = await Swal.fire({
    title: 'Cancelar item?',
    html: `<b style="color:var(--accent)">${item.name}</b><br><small>R$ ${brl(item.price)}</small>`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    confirmButtonText: 'Sim, cancelar',
    cancelButtonText: 'Voltar',
    background: '#1a1a1a', color: '#fff'
  });
  if (!isConfirmed) return;

  m.itens.splice(idx, 1);
  m.total = m.itens.reduce((s, i) => s + i.price, 0);
  await salvarMesa(num);
  Toast.fire({ icon:'success', title:'Item cancelado!' });
};

window.enviarParaCozinha = async function(num) {
  const m = window.mesasState[num];
  if (!m || m.itens.length === 0) return;

  const chave = it => `${it.name}||${it.price}||${it.obs||''}`;
  const contagem = {};
  m.impresso.forEach(c => { contagem[c] = (contagem[c] || 0) + 1; });

  const novos = [];
  const novosImpressos = [...m.impresso];
  m.itens.forEach(item => {
    const c = chave(item);
    if (contagem[c] > 0) { contagem[c]--; }
    else { novos.push(item); novosImpressos.push(c); }
  });

  if (novos.length === 0) {
    Swal.fire({ title:'Atenção', text:'Todos os itens já foram enviados!', icon:'info', background:'#1a1a1a', color:'#fff' });
    return;
  }

  const agrupados = agruparItens(novos);
  await addDoc(collection(db, 'pedidos'), {
    tipo: 'mesa',
    cliente: `Mesa ${num}`,
    garcom: m.garcom || 'Geral',
    itens: agrupados.map(i => `${i.qty}x ${i.name}||${brl(i.price * i.qty)}||${i.obs||''}`).join(';'),
    createdAt: new Date().toISOString()
  });

  m.impresso = novosImpressos;
  await salvarMesa(num);
  Swal.fire({ icon:'success', title:'Cozinha avisada!', timer:1000, showConfirmButton:false, background:'#1a1a1a', color:'#fff' });
};

window.fecharMesa = async function(num) {
  const m = window.mesasState[num];
  if (!m || m.status === 'Livre') return;

  let consumo = m.itens.reduce((a, it) => a + it.price, 0);
  let jaPago  = m.pago || 0;
  let saldo   = consumo - jaPago;
  let pagamentos = [];

  window._addPag = function(metodo) {
    const inp = document.getElementById('swal-valor-pago');
    const raw = inp.value.replace('R$ ','').replace(/\./g,'').replace(',','.');
    const val = parseFloat(raw);
    if (isNaN(val) || val <= 0) return;
    if (val > saldo + 0.05) { alert('Valor maior que o saldo!'); return; }
    pagamentos.push({ metodo, valor: val });
    saldo -= val;
    inp.value = '';
    _atualizarModalPag();
  };

  window._preencherTudo = function() {
    const inp = document.getElementById('swal-valor-pago');
    inp.value = `R$ ${brl(saldo)}`;
  };

  const _atualizarModalPag = () => {
    const elSaldo = document.getElementById('swal-saldo');
    const elTotal = document.getElementById('swal-pago-agora');
    const elLista = document.getElementById('swal-lista-pags');
    if (elSaldo) elSaldo.innerText = `R$ ${brl(saldo)}`;
    if (elTotal) elTotal.innerText = `R$ ${brl(pagamentos.reduce((a,p)=>a+p.valor,0))}`;
    if (elLista) {
      elLista.innerHTML = pagamentos.map(p => `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#10b981;
                    padding:4px 0;border-bottom:1px solid #333;">
          <span>${p.metodo}</span><span>R$ ${brl(p.valor)}</span>
        </div>`).join('');
    }
  };

  const html = `
    <div style="text-align:left;">
      <div style="background:#222;padding:15px;border-radius:10px;border:1px solid #333;
                  display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <small style="color:#888;">Consumo:</small><br>
          <strong style="font-size:1.1rem;">R$ ${brl(consumo)}</strong>
        </div>
        <div style="text-align:right;">
          <small style="color:#ff4444;">Falta Pagar:</small><br>
          <strong id="swal-saldo" style="font-size:1.3rem;color:#ff4444;">R$ ${brl(saldo)}</strong>
        </div>
        <div style="grid-column:span 2;border-top:1px solid #333;padding-top:5px;margin-top:5px;">
          <small style="color:#00ff00;">Já abatido: R$ ${brl(jaPago)}</small>
        </div>
      </div>

      <div style="margin-top:20px;background:#222;padding:15px;border-radius:10px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
          <small style="color:#ffbf00;">LANÇAR VALOR:</small>
          <small style="color:#aaa;">Nesta rodada: <strong id="swal-pago-agora" style="color:#fff;">R$ 0,00</strong></small>
        </div>
        <div style="display:flex;gap:5px;margin-bottom:10px;">
          <input id="swal-valor-pago" type="text" placeholder="R$ 0,00"
                 style="flex:1;background:#333;color:#fff;border:1px solid #444;border-radius:6px;padding:8px;"
                 oninput="mascaraMoeda(this)">
          <button onclick="window._preencherTudo()"
                  style="background:#444;color:#fff;border:none;border-radius:6px;padding:0 12px;cursor:pointer;">Tudo</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <button onclick="window._addPag('PIX')"     class="btn btn-outline">PIX</button>
          <button onclick="window._addPag('DINHEIRO')" class="btn btn-outline">DINHEIRO</button>
          <button onclick="window._addPag('DÉBITO')"   class="btn btn-outline">DÉBITO</button>
          <button onclick="window._addPag('CRÉDITO')"  class="btn btn-outline">CRÉDITO</button>
        </div>
      </div>
      <div id="swal-lista-pags" style="margin-top:10px;max-height:100px;overflow-y:auto;"></div>
    </div>`;

  const { isConfirmed } = await Swal.fire({
    title: `Acerto — Mesa ${num}`,
    html,
    showCancelButton: true,
    confirmButtonText: 'Confirmar',
    background: '#1a1a1a', color: '#fff'
  });

  delete window._addPag;
  delete window._preencherTudo;

  if (!isConfirmed || pagamentos.length === 0) return;

  const totalPago  = pagamentos.reduce((a, p) => a + p.valor, 0);
  const ehFinal    = saldo <= 0.05;
  const pagStr     = pagamentos.map(p => `${p.metodo}: R$ ${brl(p.valor)}`).join(' | ');

  await addDoc(collection(db, 'pedidos'), {
    tipo: ehFinal ? 'fechamento' : 'venda_mesa',
    cliente: `Mesa ${num}`,
    garcom: m.garcom || 'Geral',
    pagamento: pagStr,
    total: brl(totalPago),
    abatidoAnterior: (ehFinal && jaPago > 0) ? brl(jaPago) : null,
    itens: ehFinal ? m.itens.map(it => `${it.name}||${brl(it.price)}||${it.obs||''}`).join(';') : '',
    createdAt: new Date().toISOString()
  });

  if (ehFinal) {
    window.mesasState[num] = { status:'Livre', itens:[], total:0, pago:0, impresso:[], garcom:'' };
    clearHighlight();
  } else {
    m.total = consumo;
    m.pago  = jaPago + totalPago;
  }

  await salvarMesa(num);
  Swal.fire({ icon:'success', title:'Pagamento registrado!', timer:1000, showConfirmButton:false, background:'#1a1a1a', color:'#fff' });
};

/* ====================================================
   8. MESAS – DESTAQUE (HIGHLIGHT)
   ==================================================== */

function setHighlightMesa(num) { window.highlightMesa = num; applyHighlightUI(); }
function clearHighlight()       { window.highlightMesa = null; applyHighlightUI(); }

function applyHighlightUI() {
  const cards = document.querySelectorAll('.mesa-card');
  cards.forEach(c => {
    const n = Number(c.getAttribute('data-mesa'));
    c.classList.toggle('highlight', window.highlightMesa === n);
    c.style.display = (window.highlightMesa && n !== window.highlightMesa) ? 'none' : 'block';
  });
  document.getElementById('floating-toggle').style.display = window.highlightMesa ? 'block' : 'none';
}

document.getElementById('floating-toggle').addEventListener('click', clearHighlight);

/* ====================================================
   9. MODAL: CARDÁPIO DA MESA
   ==================================================== */

window.abrirMenuMesa = function(num) {
  window.mesaAtual = num;
  if (!window.carrinhoMesa[num]) window.carrinhoMesa[num] = [];
  document.getElementById('mesa-atual').innerText = num;
  document.getElementById('menu-modal').style.display = 'block';
  renderMenuProdutos(num);
  renderCarrinho(num);
};

window.fecharMenuMesa = function() {
  document.getElementById('menu-modal').style.display = 'none';
};

function renderMenuProdutos(num) {
  const el = document.getElementById('menu-produtos');
  el.innerHTML = '';

  const categorias = [
    { key:'burguers',   label:'Burguers'    },
    { key:'fritas',     label:'Fritas'      },
    { key:'jantinha',   label:'Jantinha'    },
    { key:'chapas',     label:'Chapas'      },
    { key:'tiragosto',  label:'Tira Gosto'  },
    { key:'adicionais', label:'Adicionais'  },
    { key:'bebida',     label:'Bebidas'     },
    { key:'alcoolico',  label:'Alcoólicos'  },
  ];

  categorias.forEach(cat => {
    const items = menuData.filter(i => i.category === cat.key);
    if (!items.length) return;

    const section = document.createElement('div');
    section.className = 'menu-section';

    const header = document.createElement('div');
    header.className = 'menu-section-header';
    header.innerHTML = `<h3>${cat.label}</h3><button class="toggle">+</button>`;
    section.appendChild(header);

    const wrap = document.createElement('div');
    wrap.className = 'menu-items';

    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'menu-item';
      row.innerHTML = `
        <div><h4>${item.name}</h4><small>R$ ${brl(item.price)}</small></div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-outline" onclick="addItemCarrinho(${num},${item.id})">Add</button>
          <button class="btn btn-outline" onclick="addItemCarrinhoComObs(${num},${item.id})">Obs</button>
        </div>`;
      wrap.appendChild(row);
    });

    section.appendChild(wrap);

    header.querySelector('.toggle').addEventListener('click', () => {
      wrap.classList.toggle('show');
      header.querySelector('.toggle').textContent = wrap.classList.contains('show') ? '−' : '+';
    });

    el.appendChild(section);
  });
}

window.addItemCarrinho = async function(num, id) {
  const it = menuData.find(i => i.id === id);
  let obsExtra = '';
  let precoFinal = it.price;

  if (ADDON_CATEGORIES.includes(it.category)) {
    const adicionais = await perguntarAdicionais(it);
    if (adicionais.length) {
      obsExtra = adicionais.map(a => a.label).join(', ');
      precoFinal = it.price + adicionais.reduce((s, a) => s + a.price, 0);
    }
  }

  window.carrinhoMesa[num].push({ name: it.name, price: precoFinal, obs: obsExtra });
  renderCarrinho(num);
  Toast.fire({ icon:'success', title: it.name });
};

window.addItemCarrinhoComObs = async function(num, id) {
  const it = menuData.find(i => i.id === id);
  const { value: obs } = await Swal.fire({
    title: it.name,
    input: 'text',
    inputPlaceholder: 'Observação...',
    background: '#1a1a1a', color: '#fff',
    showCancelButton: true
  });
  if (obs !== undefined) {
    window.carrinhoMesa[num].push({ name:it.name, price:it.price, obs:obs.trim() });
    renderCarrinho(num);
  }
};

window.removerItemCarrinho = function(num, idx) {
  window.carrinhoMesa[num].splice(idx, 1);
  renderCarrinho(num);
};

window.limparCarrinho = function(num) {
  window.carrinhoMesa[num] = [];
  renderCarrinho(num);
};

function renderCarrinho(num) {
  const el = document.getElementById('carrinho-list');
  el.innerHTML = '';
  (window.carrinhoMesa[num] || []).forEach((it, idx) => {
    el.innerHTML += `
      <div style="display:flex;align-items:center;justify-content:space-between;
                  padding:6px 0;border-bottom:1px solid #333;font-size:.9rem;">
        <span>• ${it.name}${it.obs ? ` <em style="color:#aaa">(${it.obs})</em>` : ''} — R$ ${brl(it.price)}</span>
        <button class="btn btn-danger" style="padding:2px 8px;"
                onclick="removerItemCarrinho(${num},${idx})">✕</button>
      </div>`;
  });
}

window.confirmarCarrinho = async function(num) {
  const carr = window.carrinhoMesa[num] || [];
  if (!carr.length) return;
  if (!window.mesasState[num]) {
    window.mesasState[num] = { status:'Ocupada', itens:[], total:0, pago:0, impresso:[], garcom:'' };
  }
  carr.forEach(it => window.mesasState[num].itens.push(it));
  window.mesasState[num].total = window.mesasState[num].itens.reduce((s,i)=>s+i.price, 0);
  await salvarMesa(num);
  window.carrinhoMesa[num] = [];
  fecharMenuMesa();
  Toast.fire({ icon:'success', title:'Itens adicionados!' });
};

window.filtrarMenu = function(termo) {
  const busca = termo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  document.querySelectorAll('.menu-item').forEach(item => {
    const nome = item.querySelector('h4').innerText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    item.style.display = nome.includes(busca) ? 'flex' : 'none';
  });
  document.querySelectorAll('.menu-section').forEach(sec => {
    const temVisivel = Array.from(sec.querySelectorAll('.menu-item')).some(i=>i.style.display==='flex');
    const lista = sec.querySelector('.menu-items');
    const btn   = sec.querySelector('.toggle');
    if (busca === '') {
      sec.style.display = 'block';
      lista?.classList.remove('show');
      if (btn) btn.textContent = '+';
    } else {
      sec.style.display = temVisivel ? 'block' : 'none';
      if (temVisivel) { lista?.classList.add('show'); if (btn) btn.textContent = '−'; }
    }
  });
};

function renderDelivery(pedidos) {
  const grid  = document.getElementById('orders-grid');
  const count = document.getElementById('orders-count');

  // Localize a função renderDelivery e altere a linha da constante 'lista'
const lista = [...pedidos]
  .filter(p => {
    // Aqui aceitamos Delivery, Retirada e também as Mesas Fechadas
    return !p.tipo || p.tipo === 'delivery' || p.tipo === 'retirada' || p.tipo === 'fechamento' || p.tipo === 'venda_mesa';
  })
  .sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));

  grid.innerHTML = '';
  count.textContent = `${lista.length} pedidos`;

  if (!lista.length) {
    grid.innerHTML = `<div class="card"><p style="color:var(--muted)"><i class="fas fa-inbox"></i> Nenhum pedido.</p></div>`;
    return;
  }

  lista.forEach((p, idx) => {
    const tipo      = p.tipo === 'retirada' ? 'retirada' : 'delivery';
    const badgeIcon = tipo === 'retirada' ? '🏠' : '🛵';
    const badgeLabel= tipo === 'retirada' ? 'Retirada' : 'Delivery';

    const itensHTML = (p.itens||'').split(';').map(item => {
      const [nome, preco, obs] = item.split('||').map(s=>s?.trim());
      if (!nome) return '';
      return `
        <div class="dcard-item-row">
          <span class="dcard-item-nome">${nome}${obs?` <span class="dcard-item-obs">(${obs})</span>`:''}</span>
          ${preco?`<span class="dcard-item-preco">R$ ${preco}</span>`:''}
        </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = `card dcard dcard-${tipo}`;
    card.innerHTML = `
      <div class="dcard-top">
        <div>
          <p class="dcard-nome">${p.cliente||'Cliente'}</p>
          <span class="dcard-num">#${idx+1}</span>
        </div>
        <span class="dcard-badge dcard-badge-${tipo}">${badgeIcon} ${badgeLabel}</span>
      </div>
      ${p.telefone?`<div class="dcard-info-row"><i class="fas fa-phone dcard-icon"></i><span>${p.telefone}</span></div>`:''}
      ${tipo!=='retirada'&&p.endereco?`<div class="dcard-info-row"><i class="fas fa-map-marker-alt dcard-icon"></i><span>${p.endereco}${p.bairro?' — '+p.bairro:''}</span></div>`:''}
      ${p.pagamento?`<div class="dcard-pag-tag"><i class="fas fa-wallet"></i> ${p.pagamento}</div>`:''}
      <hr class="dcard-divider">
      <div class="dcard-itens">${itensHTML}</div>
      <div class="dcard-footer">
        <div>
          <div class="dcard-total-label">total do pedido</div>
          <div class="dcard-total-valor">${p.total?`R$ ${p.total}`:'—'}</div>
        </div>
        ${p.createdAt?`<div class="dcard-hora">${new Date(p.createdAt).toLocaleString('pt-BR')}</div>`:''}
      </div>`;
    grid.appendChild(card);
  });

  if (window.bipAtivo && lista.length > 0) tocarBip();
}

function renderHistoricos(pedidos) {
  // --- Mesas ---
  const histMesas = pedidos
    .filter(p => p.tipo === 'fechamento')
    .sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));

  const mesasHistEl  = document.getElementById('mesas-historico');
  const mesasTotalEl = document.getElementById('mesas-total');
  mesasHistEl.innerHTML = '';
  let totalMesas = 0;

  histMesas.forEach((p, idx) => {
    const t = parseFloat(p.total||0);
    totalMesas += isNaN(t) ? 0 : t;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '12px';
    card.innerHTML = `
      <h3><i class="fas fa-chair"></i> ${p.cliente||'Mesa'}</h3>
      <p style="color:var(--muted);">#${idx+1} — ${p.createdAt?new Date(p.createdAt).toLocaleString('pt-BR'):''}</p>
      ${p.garcom?`<p><strong>Garçom:</strong> ${p.garcom}</p>`:''}
      ${p.pagamento?`<p><strong>Pagamento:</strong> ${p.pagamento}</p>`:''}
      <p><strong>Itens:</strong><br>
        ${(p.itens||'').split(';').map(item=>{
          const [n,pr,ob]=item.split('||').map(s=>s?.trim());
          return `&nbsp;&nbsp;• ${n}${pr?' — <b>R$ '+pr+'</b>':''}${ob?` <em style="color:#aaa">(${ob})</em>`:''}`;
        }).join('<br>')}
      </p>
      ${p.total?`<p class="mesa-total">Total: R$ ${p.total}</p>`:''}`;
    mesasHistEl.appendChild(card);
  });

  mesasTotalEl.textContent = `Total Mesas: R$ ${brl(totalMesas)}`;

  // --- Delivery ---
  const histDelivery  = pedidos
    .filter(p => !p.tipo || p.tipo === 'delivery')
    .sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));

  const deliveryHistEl  = document.getElementById('delivery-historico');
  const deliveryTotalEl = document.getElementById('delivery-total');
  deliveryHistEl.innerHTML = '';
  let totalDelivery = 0;

  histDelivery.forEach((p, idx) => {
    const t = parseFloat(p.total||0);
    totalDelivery += isNaN(t) ? 0 : t;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '12px';
    card.innerHTML = `
      <h3><i class="fas fa-truck"></i> ${p.cliente||'Cliente'}</h3>
      <p style="color:var(--muted);">#${idx+1} — ${p.createdAt?new Date(p.createdAt).toLocaleString('pt-BR'):''}</p>
      <p><strong>Itens:</strong><br>
        ${(p.itens||'').split(';').map(item=>{
          const [n,pr,ob]=item.split('||').map(s=>s?.trim());
          return `&nbsp;&nbsp;• ${n}${pr?' — <b>R$ '+pr+'</b>':''}${ob?` <em style="color:#aaa">(${ob})</em>`:''}`;
        }).join('<br>')}
      </p>
      ${p.total?`<p class="mesa-total">Total: R$ ${p.total}</p>`:''}`;
    deliveryHistEl.appendChild(card);
  });

  deliveryTotalEl.textContent = `Total Delivery: R$ ${brl(totalDelivery)}`;
}

document.getElementById('btn-pdf').addEventListener('click', async () => {
  if (!(await requireManager())) return;

  const { jsPDF } = window.jspdf;
  const pdf  = new jsPDF();
  const hoje = new Date().toLocaleDateString('pt-BR');
  const hora = new Date().toLocaleTimeString('pt-BR');

  pdf.setFillColor(30,30,30); pdf.rect(0,0,210,35,'F');
  pdf.setTextColor(255,191,0); pdf.setFont('helvetica','bold'); pdf.setFontSize(22);
  pdf.text('BURGUER GRILL',105,15,{align:'center'});
  pdf.setTextColor(255,255,255); pdf.setFontSize(10);
  pdf.text('RELATÓRIO DE VENDAS',105,23,{align:'center'});
  pdf.text(`Gerado em: ${hoje} às ${hora}`,105,29,{align:'center'});

  let y=45, totGeral=0, totPix=0, totCartao=0, totDinheiro=0;

  const snap = await getDocs(collection(db,'pedidos'));
  const docs = snap.docs.map(d=>d.data())
    .filter(p=>['fechamento','delivery','retirada','venda_mesa'].includes(p.tipo))
    .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

  docs.forEach(p => {
    const valor = parseFloat(p.total||0);
    if (isNaN(valor)||valor<=0) return;
    totGeral += valor;

    const pagTxt = (p.pagamento||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    const partes = pagTxt.split('|');
    let temExplicito = false;

    partes.forEach(parte => {
      const m = parte.match(/([\d]+[.,][\d]{2})/);
      if (!m) return;
      const v = parseFloat(m[1].replace(',','.'));
      if (isNaN(v)||v<=0) return;
      temExplicito = true;
      if (parte.includes('PIX'))          totPix     += v;
      else if (parte.includes('DIN'))     totDinheiro+= v;
      else                                totCartao  += v;
    });

    if (!temExplicito) {
      if (pagTxt.includes('PIX'))          totPix     += valor;
      else if (pagTxt.includes('DIN'))     totDinheiro+= valor;
      else                                 totCartao  += valor;
    }

    if (y+30>265){ pdf.addPage(); y=20; }
    pdf.setFont('helvetica','bold');   pdf.setFontSize(10); pdf.setTextColor(40);
    pdf.text(`${p.cliente||'Venda'} | Garçom: ${p.garcom||'Geral'}`,10,y);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
    const dataF = p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : '---';
    pdf.text(`Data: ${dataF}`,10,y+5);
    y+=11;

    if (partes.length>1) {
      partes.forEach(parte=>{
        const m2 = parte.match(/([\d]+[.,][\d]{2})/);
        const v2 = m2?parseFloat(m2[1].replace(',','.')):0;
        const nm = parte.split(':')[0].trim();
        pdf.setTextColor(80); pdf.setFont('helvetica','normal'); pdf.text(`  -> ${nm}:`,12,y);
        if(v2>0){ pdf.setFont('helvetica','bold'); pdf.setTextColor(40); pdf.text(`R$ ${brl(v2)}`,200,y,{align:'right'}); }
        y+=5; if(y>265){pdf.addPage();y=20;}
      });
      pdf.setFont('helvetica','bold'); pdf.setTextColor(20);
      pdf.text('  TOTAL:',12,y); pdf.text(`R$ ${brl(valor)}`,200,y,{align:'right'}); y+=9;
    } else {
      const meio = (p.pagamento||'Não informado').split(':')[0].trim();
      pdf.setTextColor(40); pdf.setFont('helvetica','normal'); pdf.text(`Meio: ${meio}`,10,y);
      pdf.setFont('helvetica','bold'); pdf.text(`R$ ${brl(valor)}`,200,y,{align:'right'}); y+=9;
    }

    pdf.setDrawColor(220); pdf.line(10,y,200,y); y+=4;
  });

  // Resumo final
  y+=5; if(y+70>280){pdf.addPage();y=20;}
  pdf.setDrawColor(0); pdf.line(10,y,200,y); y+=8;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(40);
  pdf.text('RESUMO DE CAIXA',10,y); y+=7;
  pdf.setFontSize(10); pdf.setFont('helvetica','normal');
  pdf.text('Total em PIX:',    15,y); pdf.text(`R$ ${brl(totPix)}`,     200,y,{align:'right'}); y+=6;
  pdf.text('Total em Cartões:',15,y); pdf.text(`R$ ${brl(totCartao)}`,  200,y,{align:'right'}); y+=6;
  pdf.text('Total em Dinheiro:',15,y);pdf.text(`R$ ${brl(totDinheiro)}`,200,y,{align:'right'}); y+=12;
  pdf.setFillColor(30,30,30); pdf.rect(10,y,190,12,'F');
  pdf.setTextColor(255,191,0); pdf.setFontSize(12); pdf.setFont('helvetica','bold');
  pdf.text('FATURAMENTO TOTAL:',15,y+8); pdf.text(`R$ ${brl(totGeral)}`,195,y+8,{align:'right'});

  pdf.save(`relatorio_financeiro_${hoje.replace(/\//g,'-')}.pdf`);
});

document.getElementById('btn-login').addEventListener('click', async () => {
  const senha = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  if (!senha) { errEl.textContent = 'Digite a senha.'; return; }

  const senhaDoc = await getDoc(doc(db, 'config', 'senhaGerente'));
  const senhaCorreta = senhaDoc.exists() ? senhaDoc.data().senha : '1234';

  if (senha !== senhaCorreta) {
    errEl.textContent = 'Senha incorreta.';
    return;
  }

  // Login anônimo para manter autenticação Firebase ativa
  const { signInAnonymously } = await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js");
  await signInAnonymously(auth);
});

document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

let unsubPedidos   = null;
let unsubMesas     = null;
let unsubEstoque   = null;

onAuthStateChanged(auth, user => {
  document.getElementById('login-screen').style.display = user ? 'none'  : 'flex';
  document.getElementById('main-panel').style.display   = user ? 'block' : 'none';

  if (user) {
    popularItensStaff();
    renderStaffLocal();
    openTab('mesas');

    // Inicia listeners só após login
    unsubPedidos = onSnapshot(query(collection(db, 'pedidos')), snap => {
      const pedidos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderDelivery(pedidos);
      renderHistoricos(pedidos);
    });

    unsubMesas = onSnapshot(collection(db, 'mesasAtivas'), snap => {
      window.mesasState = {};
      snap.forEach(d => { window.mesasState[d.id] = d.data(); });
      renderMesas();
    });

    unsubEstoque = onSnapshot(doc(db, 'config', 'estoque'), snap => {
      if (snap.exists()) {
        window.esgotados = new Set(snap.data().esgotados || []);
      } else {
        window.esgotados = new Set();
      }
      renderEstoque();
    });

  } else {
    // Para os listeners ao fazer logout
    if (unsubPedidos)  { unsubPedidos();  unsubPedidos  = null; }
    if (unsubMesas)    { unsubMesas();    unsubMesas    = null; }
    if (unsubEstoque)  { unsubEstoque();  unsubEstoque  = null; }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'F12') e.preventDefault();
  if (e.ctrlKey && (e.key==='u'||e.key==='U')) e.preventDefault();
  if (e.ctrlKey && e.shiftKey && e.key==='I') e.preventDefault();
});
document.addEventListener('contextmenu', e => e.preventDefault());
