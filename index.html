<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Painel de Controle — BURGUER GRILL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
   :root {
  --bg: #121212;
  --card: #1e1e1e;
  --border: #333;
  --accent: #ffbf00;
  --danger: #d32f2f;
  --success: #25d366;
  --text: #eee;
  --muted: #aaa;
}

* {
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  margin: 0;
}

/* --- LOGIN SCREEN --- */
#login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
}

#login-screen input:not([type="password"]) {
  margin: 8px;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: #fff;
  width: 280px;
}

/* Container específico para o input de senha com olhinho */
.password-container {
  position: relative;
  width: 280px;
  margin: 8px auto;
}

.password-container input {
  width: 100% !important;
  padding: 10px 40px 10px 10px !important; /* Espaço na direita para o ícone */
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: #fff;
  margin: 0 !important;
}

#toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: var(--muted);
  z-index: 10;
  font-size: 1.1rem;
}

#toggle-password:hover {
  color: var(--accent);
}

#login-screen button {
  margin-top: 12px;
}

/* --- INTERFACE GERAL --- */
header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

header h1 {
  margin: 0;
  color: var(--accent);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.actions .btn {
  min-width: 140px;
}

.tabs, .subtabs {
  display: flex;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.subtabs {
  padding: 0;
  border-bottom: none;
  margin-bottom: 12px;
}

.tab-btn, .subtab-btn {
  background: #222;
  color: var(--accent);
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.subtab-btn {
  padding: 8px 12px;
  border-radius: 6px;
}

.tab-btn.active, .subtab-btn.active {
  background: var(--accent);
  color: #000;
}

.tab, .subtab {
  display: none;
}

.tab.active, .subtab.active {
  display: block;
}

.tab {
  padding: 16px 20px;
}

/* --- GRID E CARDS --- */
.grid, .mesas-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.card, .mesa-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}

.mesa-card {
  transition: border-color .2s, transform .2s, box-shadow .2s, opacity .2s;
}

.mesa-card.livre { border-color: var(--success); }
.mesa-card.ocupada { border-color: var(--danger); }

.mesa-items {
  border-top: 1px dashed var(--border);
  margin-top: 8px;
  padding-top: 8px;
  max-height: 220px;
  overflow: auto;
}

.mesa-total, .hist-total {
  margin-top: 8px;
  font-weight: bold;
  color: var(--accent);
}

/* --- ESTADOS DE DESTAQUE --- */
.mesa-card.highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  transform: scale(1.02);
}

.mesas-grid.highlight-mode .mesa-card:not(.highlight) {
  opacity: 0.25;
  pointer-events: none;
}

/* --- BOTÃO FLUTUANTE --- */
#floating-toggle {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 1000;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50px;
  padding: 12px 16px;
  font-weight: bold;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  cursor: pointer;
  display: none;
}

/* --- BOTÕES --- */
.btn {
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: bold;
}

.btn-accent { background: var(--accent); color: #000; }
.btn-outline { background: #222; color: var(--accent); border: 1px solid var(--accent); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }

/* --- MODAL --- */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 999;
  overflow: auto;
}

.modal-content {
  max-width: 900px;
  margin: 40px auto;
  background: #1a1a1a;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.menu-section {
  margin-bottom: 14px;
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
}

.menu-section-header {
  background: #222;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.menu-section-header h3 { margin: 0; color: var(--accent); font-size: 1rem; }
.menu-section-header .toggle { font-size: 24px; background: transparent; color: #fff; border: none; cursor: pointer; }

.menu-items { display: none; padding: 10px 12px; background: #1f1f1f; }
.menu-items.show { display: block; }

.menu-item {
  background: #222;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.carrinho-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

/* --- INPUTS GERAIS --- */
select {
  background: #222;
  color: #fff;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
}

.swal2-radio label { color: #000 !important; }

/* --- MEDIA QUERIES --- */
@media (max-width:1024px) {
  .grid, .mesas-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width:768px) {
  .grid, .mesas-grid { grid-template-columns: 1fr; }
  .mesas-grid.highlight-mode { grid-template-columns: 1fr; }
  .mesa-card.highlight { transform: scale(1.03); }
  .btn { padding: 10px 12px; }
}
  </style>
</head>

async function requireManager() {
  const user = auth.currentUser;
  
  const { value: pwd } = await Swal.fire({
    title: 'Senha Gerente',
    background: '#1a1a1a',
    color: '#fff',
    html: `
      <div style="position:relative; width: 100%; margin-top: 15px;">
        <input id="swal-input-password" type="password" class="swal2-input" 
               placeholder="Digite a senha" 
               style="width: 80%; background: #222; color: #fff; border: 1px solid #444;">
        <i id="swal-toggle-password" class="fas fa-eye" 
           style="position:absolute; right:15%; top:50%; transform:translateY(-50%); cursor:pointer; color: #ffbf00; z-index:100; font-size: 18px;"></i>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Confirmar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: '#ffbf00',
    focusConfirm: false,
    didOpen: () => {
      // Lógica do olhinho dentro do alerta
      const toggleBtn = document.getElementById('swal-toggle-password');
      const pwdInput = document.getElementById('swal-input-password');
      
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleBtn.classList.toggle('fa-eye');
        toggleBtn.classList.toggle('fa-eye-slash');
      });

      // Permitir apertar "Enter" para confirmar
      pwdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') Swal.clickConfirm();
      });
    },
    preConfirm: () => {
      const val = document.getElementById('swal-input-password').value;
      if (!val) {
        Swal.showValidationMessage('Por favor, digite a senha');
      }
      return val;
    }
  });

  if (!pwd) return false;

  try {
    // Re-autentica o usuário para garantir que é o gerente
    await signInWithEmailAndPassword(auth, user.email, pwd);
    return true;
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Erro', text: 'Senha incorreta', background: '#1a1a1a', color: '#fff' });
    return false;
  }
}

// Função auxiliar para agrupar itens iguais
function agruparItens(itens) {
  const grouped = {};
  itens.forEach(it => {
    const key = it.name + (it.obs || '');
    if (!grouped[key]) {
      grouped[key] = { ...it, qty: 0 };
    }
    grouped[key].qty += 1;
  });
  return Object.values(grouped);
}

window.enviarParaCozinha = async function (num) {
  const m = window.mesasState[num];
  if (!m || m.itens.length === 0) return;

  // Função para criar a assinatura do item
  const gerarChave = (it) => `${it.name}||${it.price}||${it.obs || ''}`;

  // 1. Contabiliza quantas vezes cada chave já foi impressa
  const contagemImpressos = {};
  m.impresso.forEach(c => {
    contagemImpressos[c] = (contagemImpressos[c] || 0) + 1;
  });

  // 2. Filtra apenas o que sobrou (o que é novo ou repetição nova)
  const novosParaImprimir = [];
  const copiaImpressos = [...m.impresso]; // Cópia para atualizar o estado depois

  m.itens.forEach(item => {
    const chave = gerarChave(item);
    if (contagemImpressos[chave] > 0) {
      // Se já imprimiu antes, decrementa a contagem e não adiciona nos "novos"
      contagemImpressos[chave]--;
    } else {
      // Se a contagem acabou ou nunca existiu, é um item novo/repetido
      novosParaImprimir.push(item);
      copiaImpressos.push(chave);
    }
  });

  if (novosParaImprimir.length === 0) {
    Swal.fire({ title: 'Atenção', text: 'Todos os itens atuais já foram enviados!', icon: 'info' });
    return;
  }

  // 3. Agrupa os novos itens para a comanda sair bonita (ex: 2x Coca)
  const agrupados = agruparItens(novosParaImprimir);

  try {
    // 4. Grava no Firestore para o servidor Node.js ler
    await addDoc(collection(db, "pedidos"), {
      tipo: 'mesa',
      cliente: `Mesa ${num}`,
      garcom: m.garcom || 'Geral',
      itens: agrupados.map(i => `${i.qty}x ${i.name}||${(i.price * i.qty).toFixed(2)}||${i.obs || ''}`).join(';'),
      createdAt: new Date().toISOString()
    });

    // 5. Atualiza o estado da mesa com a nova lista de impressos
    m.impresso = copiaImpressos;
    await saveMesaFirebase(num);

    Swal.fire({ icon: 'success', title: 'Cozinha Avisada!', timer: 1000, showConfirmButton: false });
  } catch (error) {
    console.error("Erro ao enviar:", error);
    Swal.fire('Erro', 'Não foi possível enviar para a cozinha', 'error');
  }
};

window.fecharMesa = async function (num) {
  const m = window.mesasState[num];
  if (!m || m.status === 'Livre') return;

  const { value: pag } = await Swal.fire({
    title: 'Fechar Mesa ' + num,
    input: 'radio',
    inputOptions: { 
      'PIX': 'PIX',
      'DEBITO': 'DEBITO',
      'CREDITO': 'CREDITO',
      'DINHEIRO': 'DINHEIRO'
    },
    background: '#1a1a1a',
    color: '#fff',
    showCancelButton: true,
    cancelButtonText: 'Voltar'
  });

  if (!pag) return;

  // No fechamento, agrupamos TODOS os itens da mesa para a nota final
  const agrupadosGeral = agruparItens(m.itens);

  try {
    await addDoc(collection(db, "pedidos"), {
      tipo: 'fechamento',
      cliente: `Mesa ${num}`,
      garcom: m.garcom,
      pagamento: pag,
      itens: agrupadosGeral.map(i => `${i.qty}x ${i.name}||${(i.price * i.qty).toFixed(2)}||${i.obs || ''}`).join(';'),
      total: m.total.toFixed(2),
      createdAt: new Date().toISOString()
    });

    // Reseta a mesa para o estado Livre
    window.mesasState[num] = { status: 'Livre', itens: [], total: 0, impresso: [], garcom: '' };
    await saveMesaFirebase(num);
    
    if (typeof clearHighlight === 'function') clearHighlight();

    Swal.fire({ icon: 'success', title: 'Mesa Finalizada!', text: 'Cupom enviado para a impressora principal.' });
  } catch (error) {
    Swal.fire('Erro', 'Erro ao fechar mesa no banco.', 'error');
  }
};


// Estado do bip
window.bipAtivo = true;
const btnBip = document.getElementById('btn-bip');

btnBip.addEventListener('click', () => {
  window.bipAtivo = !window.bipAtivo;
  btnBip.innerHTML = window.bipAtivo 
    ? '<i class="fas fa-bell"></i> Bip: ON' 
    : '<i class="fas fa-bell-slash"></i> Bip: OFF';
});

// Função para tocar 3 bips curtos
function tocarBip() {
  if (!window.bipAtivo) return;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  for (let i = 0; i < 1; i++) {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime + i * 0.4);
    osc.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + i * 0.4);
    osc.stop(audioCtx.currentTime + i * 0.4 + 0.2);
  }
}

// Lógica para mostrar/esconder senha
const togglePassword = document.getElementById('toggle-password');
const passwordInput = document.getElementById('login-password');

togglePassword.addEventListener('click', function() {
  // Alterna entre 'password' (escondido) e 'text' (visível)
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';

  // Alterna o ícone entre olho aberto e olho cortado
  this.classList.toggle('fa-eye');
  this.classList.toggle('fa-eye-slash');
});
// Bloqueios de segurança (mantidos como no original)
document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); }
    if (e.key === 'F12') { e.preventDefault(); }
});
document.addEventListener('keydown', function (event) {
    if (event.ctrlKey && event.shiftKey && event.key === 'I') { event.preventDefault(); }
});
document.addEventListener('contextmenu', function (event) { event.preventDefault(); });
